instances:
  - name: uniproxy-01
    group: proxy-cluster-1
    replicas: 2
    nodePort: 30080
    isentry: "yes"
    connections:
      - name: uniproxy-02
        type: http
        url: "http://uniproxy-02.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"
      - name: uniproxy-03
        type: http
        url: "http://uniproxy-03.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"

  - name: uniproxy-02
    group: proxy-cluster-1
    replicas: 2
    connections:
      - name: redis
        type: redis
        url: "redis://redis.dephealth-redis.svc:6379"
        critical: "no"
      - name: grpc-stub
        type: grpc
        host: "grpc-stub.dephealth-grpc-stub.svc"
        port: "9090"
        critical: "no"
      - name: uniproxy-04
        type: http
        url: "http://uniproxy-04.dephealth-uniproxy-2.svc:8080"
        critical: "yes"
        healthPath: "/"
      - name: uniproxy-pr1
        type: http
        url: "http://192.168.218.168:8080"
        critical: "yes"
        healthPath: "/"

  - name: uniproxy-03
    group: proxy-cluster-1
    replicas: 3
    # Reserved dep_* labels (interim env mechanism): the ldap endpoint has a
    # sole source and gets explicit placement. The postgresql labels must stay
    # in sync with uniproxy-07/uniproxy-08 in ns2 — the endpoint is shared by
    # all three sources and dephealth-ui requires unanimous values.
    extraEnv:
      - name: DEPHEALTH_POSTGRESQL_LABEL_DEP_NAMESPACE
        value: "db"
      - name: DEPHEALTH_POSTGRESQL_LABEL_DEP_GROUP
        value: "data"
      - name: DEPHEALTH_LDAP_LABEL_DEP_NAMESPACE
        value: "infra"
      - name: DEPHEALTH_LDAP_LABEL_DEP_GROUP
        value: "identity"
    connections:
      - name: postgresql
        type: postgres
        url: "postgres://dephealth:dephealth-test-pass@postgresql.dephealth-postgresql.svc:5432/dephealth"
        critical: "yes"
      - name: ldap
        type: ldap
        host: "ds389.dephealth-389ds.svc"
        port: "3389"
        critical: "no"
      - name: uniproxy-01
        type: http
        url: "http://uniproxy-01.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"
