# Test topology — Namespace 1
#
# Three uniproxy instances forming a dependency chain with cross-links.
# All dependencies resolve inside the cluster via .svc FQDNs.
#
#   uniproxy-01 (entry, NodePort 30080) ──► uniproxy-02, uniproxy-03
#   uniproxy-02 ──► redis, grpc-stub, uniproxy-04 (ns2)
#   uniproxy-03 ──► postgresql, ldap, uniproxy-01
#
# NOTE: The homelab topology also points uniproxy-02 at a bare-metal host
# (uniproxy-pr1). That requires an external host and is covered separately in
# the "Optional: Bare Metal Host" section of docs/test-environment.md. Add the
# connection below once that host is set up.

instances:
  - name: uniproxy-01
    group: proxy-cluster-1
    replicas: 2
    nodePort: 30080
    isentry: "yes"
    connections:
      - name: uniproxy-02
        type: http
        url: "http://uniproxy-02.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"
      - name: uniproxy-03
        type: http
        url: "http://uniproxy-03.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"

  - name: uniproxy-02
    group: proxy-cluster-1
    replicas: 2
    connections:
      - name: redis
        type: redis
        url: "redis://redis.dephealth-redis.svc:6379"
        critical: "no"
      - name: grpc-stub
        type: grpc
        host: "grpc-stub.dephealth-grpc-stub.svc"
        port: "9090"
        critical: "no"
      - name: uniproxy-04
        type: http
        url: "http://uniproxy-04.dephealth-uniproxy-2.svc:8080"
        critical: "yes"
        healthPath: "/"
      # Optional: enable after setting up a bare-metal host running uniproxy.
      # - name: uniproxy-pr1
      #   type: http
      #   url: "http://<BARE_METAL_HOST_IP>:8080"
      #   critical: "yes"
      #   healthPath: "/"

  - name: uniproxy-03
    group: proxy-cluster-1
    replicas: 3
    connections:
      - name: postgresql
        type: postgres
        url: "postgres://dephealth:dephealth-test-pass@postgresql.dephealth-postgresql.svc:5432/dephealth"
        critical: "yes"
      - name: ldap
        type: ldap
        host: "ds389.dephealth-389ds.svc"
        port: "3389"
        critical: "no"
      - name: uniproxy-01
        type: http
        url: "http://uniproxy-01.dephealth-uniproxy.svc:8080"
        critical: "yes"
        healthPath: "/"
