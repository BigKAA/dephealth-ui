<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - dephealth-ui</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            color: #333;
        }

        .login-container {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            width: 100%;
            max-width: 380px;
        }

        .login-title {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: #1a1a2e;
        }

        .login-subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-top: -1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 0.3rem;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95rem;
            background: #fafafa;
            color: #333;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4a90d9;
            background: #fff;
        }

        .btn-login {
            width: 100%;
            padding: 0.65rem;
            border: none;
            border-radius: 4px;
            background: #4a90d9;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s;
        }

        .btn-login:hover {
            background: #3a7bc8;
        }

        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.6rem 0.75rem;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #1a1a2e;
                color: #e0e0e0;
            }

            .login-container {
                background: #16213e;
                box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4);
            }

            .login-title {
                color: #e0e0e0;
            }

            .login-subtitle {
                color: #888;
            }

            .form-group label {
                color: #aaa;
            }

            .form-group input {
                background: #0f3460;
                border-color: #2a4a7f;
                color: #e0e0e0;
            }

            .form-group input:focus {
                border-color: #4a90d9;
                background: #1a3a6a;
            }

            .btn-login {
                background: #4a90d9;
            }

            .btn-login:hover {
                background: #5aa0e9;
            }

            .error-message {
                background: #3b1010;
                border-color: #7f1d1d;
                color: #fca5a5;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1 class="login-title">dephealth-ui</h1>
        <p class="login-subtitle">Sign in to continue</p>
        {{if .Error}}
        <div class="error-message">{{.Error}}</div>
        {{end}}
        <form method="POST" action="/auth/login">
            <input type="hidden" name="_csrf" value="{{.CSRFToken}}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="{{.Username}}" placeholder="Enter username" autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Sign In</button>
        </form>
    </div>
</body>
</html>
